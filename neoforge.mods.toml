modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AutoMods"
description='''卫星导航（SatNav）：独立模组，不依赖任何其他模组。卫星、服务器组网与导航器，提供跨大陆的卫星导航服务。'''
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# 可选依赖：Jade（缺失时联动模块自动禁用，本体正常运行）
[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[11.0,)"
ordering="NONE"
side="CLIENT"
